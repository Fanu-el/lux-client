name: lux
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0-113.1.beta

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  flutter_secure_storage: ^10.2.0
  go_router: ^14.0.0
  provider: ^6.0.0
  flutter_dotenv: ^5.1.0
  flutter_markdown_plus: ^1.0.7
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "lib/assets/images/logos/logo-no-text.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/images/logos/logo-no-text.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/assets/images/logos/
